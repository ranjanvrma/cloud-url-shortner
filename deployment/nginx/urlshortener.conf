# Nginx config for VM1 (public entry point).
# Install at /etc/nginx/sites-available/urlshortener.conf and symlink into
# sites-enabled. Replace VM2_PRIVATE_IP with VM2's private IP address.
#
# Frontend static files are copied to /var/www/urlshortener on this VM
# (see deployment/scripts/03_setup_vm1_nginx.sh). Any request that doesn't
# match a static file (i.e. a short code, or /api/*) is proxied to VM2.

upstream backend_app {
    server VM2_PRIVATE_IP:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 64k;

    root /var/www/urlshortener;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri @backend;
    }

    location @backend {
        proxy_pass http://backend_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ /\. {
        deny all;
    }
}
